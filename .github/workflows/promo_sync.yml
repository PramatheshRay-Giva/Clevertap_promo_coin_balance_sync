name: Daily Promo Balance Sync

on:
  schedule:
    # 19:30 UTC is exactly 1:00 AM IST
    - cron: '30 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync_promo_balances:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Promo Sync Script
        env:
          MB_PASSWORD: ${{ secrets.MB_PASSWORD }}
          CT_PASSCODE: ${{ secrets.CT_PASSCODE }}
        run: python sync_promo.py
